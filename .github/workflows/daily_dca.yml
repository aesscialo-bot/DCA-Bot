name: Daily Crypto DCA

on:
  # Railway dispatches this workflow from the absolute per-asset decision times.
  workflow_dispatch:
    inputs:
      symbols_json:
        description: Optional sanitized scheduler context; the trader still revalidates all live state
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: dca-execution-state-writers
  queue: max
  cancel-in-progress: false

jobs:
  trade:
    name: Revalidate and execute due decisions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run fail-closed DCA trader
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_PAT_FOR_VARS: ${{ secrets.GH_PAT_FOR_VARS }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GHOSTFOLIO_TOKEN: ${{ secrets.GHOSTFOLIO_TOKEN }}
          DCA_TARGET_MAP: ${{ vars.DCA_TARGET_MAP }}
          DCA_ANALYSIS_STATE: ${{ vars.DCA_ANALYSIS_STATE || '{}' }}
          DCA_EXECUTION_STATE: ${{ vars.DCA_EXECUTION_STATE || '{}' }}
          GHOSTFOLIO_URL: ${{ vars.GHOSTFOLIO_URL || 'https://ghostfol.io' }}
          PORTFOLIO_ACCOUNT_MAP: ${{ vars.PORTFOLIO_ACCOUNT_MAP }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Bangkok' }}
          DCA_SYMBOLS_JSON: ${{ inputs.symbols_json || '' }}
        run: python -u crypto_dca.py
