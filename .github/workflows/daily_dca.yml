name: Daily Crypto DCA

on:
  schedule:
    # Independent due-check fallback at Bangkok minutes 02,17,32,47.
    - cron: "2,17,32,47 * * * *"
  # Railway also dispatches this workflow from absolute per-asset decision times.
  workflow_dispatch:
    inputs:
      symbols_json:
        description: Optional sanitized scheduler context; the trader still revalidates all live state
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: dca-execution-state-writers
  cancel-in-progress: false

jobs:
  trade:
    name: Revalidate and execute due decisions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Load protected production state
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_VARS }}
        shell: bash
        run: |
          set -euo pipefail
          load_variable() {
            local name="$1"
            local value
            if ! value="$(gh variable get "$name" --repo "$GITHUB_REPOSITORY" 2>/dev/null)"; then
              echo "Could not load required repository variable $name; refusing to trade." >&2
              exit 1
            fi
            while IFS= read -r line; do
              [ -z "$line" ] || printf '::add-mask::%s\n' "$line"
            done <<< "$value"
            local delimiter="DCA_${GITHUB_RUN_ID}_${RANDOM}"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
          }
          load_variable DCA_TARGET_MAP
          load_variable DCA_ANALYSIS_STATE
          load_variable DCA_EXECUTION_STATE

      - name: Run fail-closed DCA trader
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_PAT_FOR_VARS: ${{ secrets.GH_PAT_FOR_VARS }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GHOSTFOLIO_TOKEN: ${{ secrets.GHOSTFOLIO_TOKEN }}
          GHOSTFOLIO_URL: ${{ vars.GHOSTFOLIO_URL || 'https://ghostfol.io' }}
          PORTFOLIO_ACCOUNT_MAP: ${{ vars.PORTFOLIO_ACCOUNT_MAP }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Bangkok' }}
          DCA_START_DATE: ${{ vars.DCA_START_DATE }}
          DCA_SYMBOLS_JSON: ${{ inputs.symbols_json || '' }}
          DCA_TRADING_MODE: ${{ vars.DCA_TRADING_MODE || 'shadow' }}
          DCA_CANARY_SYMBOL: ${{ vars.DCA_CANARY_SYMBOL || 'SOL_GBP' }}
          GHOSTFOLIO_DIRECT_SYNC_ENABLED: "false"
        run: python -u crypto_dca.py
