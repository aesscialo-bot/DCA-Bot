name: Portfolio Balance Check

on:
  # Run monthly on the 5th at 7am Bangkok time (00:00 UTC = 07:00 Bangkok UTC+7)
  schedule:
    - cron: '0 0 5 * *'   # Monthly: 5th at 07:00 BKK
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      short_report:
        description: 'Short report (balance only, no trade history)'
        required: false
        type: boolean
        default: false
      bootstrap_history:
        description: 'Recovery-only: rebuild canonical 65-day Kraken history'
        required: false
        type: boolean
        default: false

jobs:
  check_balance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: pip install --upgrade pip && pip install -r requirements.txt

    - name: Load protected production rules
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GH_PAT_FOR_VARS }}
      shell: bash
      run: |
        set -euo pipefail
        if ! value="$(gh variable get DCA_TARGET_MAP --repo "$GITHUB_REPOSITORY" 2>/dev/null)"; then
          echo "Could not load DCA_TARGET_MAP; refusing the report." >&2
          exit 1
        fi
        while IFS= read -r line; do
          [ -z "$line" ] || printf '::add-mask::%s\n' "$line"
        done <<< "$value"
        delimiter="DCA_${GITHUB_RUN_ID}_${RANDOM}"
        printf 'DCA_TARGET_MAP<<%s\n%s\n%s\n' "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"

    - name: Audit bot order state (non-production ref)
      if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
      env:
        KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
        KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
        TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Bangkok' }}
      run: |
        python - <<'PY'
        from kraken_order_audit import audit_orders
        result = audit_orders()
        if (
            not result["flow_integrity_ok"]
            or result["unresolved_bot_orders"]
            or result["unknown_timestamp_closed_bot_orders"]
        ):
            raise SystemExit("Kraken order integrity audit failed")
        print(
            "Kraken order integrity is clear: "
            f"{result['same_day_completed_dca_flows']} complete DCA flow(s), "
            "zero unresolved or unknown-timestamp bot orders."
        )
        PY

    - name: Load private history Gist identity (recovery validation)
      if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/recovery/dca-core' && inputs.bootstrap_history == true
      env:
        GH_TOKEN: ${{ secrets.GH_PAT_FOR_VARS }}
      shell: bash
      run: |
        set -euo pipefail
        value="$(gh variable get DCA_HISTORY_GIST_ID --repo "$GITHUB_REPOSITORY")"
        printf '::add-mask::%s\n' "$value"
        printf 'DCA_HISTORY_GIST_ID=%s\n' "$value" >> "$GITHUB_ENV"

    - name: Rebuild canonical 65-day Kraken history (recovery validation)
      if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/recovery/dca-core' && inputs.bootstrap_history == true
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      run: python -u kraken_history.py bootstrap --targets BTC_GBP,HYPE_USD,SOL_GBP

    - name: Check Portfolio Balance
      if: github.ref == 'refs/heads/main'
      env:
        # API credentials
        KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
        KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
        
        # Discord notification
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        
        # Configuration
        TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Bangkok' }}
        
        # Manual short reports are opt-in; monthly reports include trade history.
        SHORT_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.short_report == true && 'true' || 'false' }}
        
      run: python -u portfolio_balance.py
