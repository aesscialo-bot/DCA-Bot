name: Portfolio Balance Check

on:
  # Run monthly on the 5th at 7am Bangkok time (00:00 UTC = 07:00 Bangkok UTC+7)
  schedule:
    - cron: '0 0 5 * *'   # Monthly: 5th at 07:00 BKK
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      short_report:
        description: 'Short report (balance only, no trade history)'
        required: false
        type: boolean
        default: false

jobs:
  check_balance:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: pip install --upgrade pip && pip install -r requirements.txt

    - name: Load protected production rules
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GH_PAT_FOR_VARS }}
      shell: bash
      run: |
        set -euo pipefail
        if ! value="$(gh variable get DCA_TARGET_MAP --repo "$GITHUB_REPOSITORY" 2>/dev/null)"; then
          echo "Could not load DCA_TARGET_MAP; refusing the report." >&2
          exit 1
        fi
        while IFS= read -r line; do
          [ -z "$line" ] || printf '::add-mask::%s\n' "$line"
        done <<< "$value"
        delimiter="DCA_${GITHUB_RUN_ID}_${RANDOM}"
        printf 'DCA_TARGET_MAP<<%s\n%s\n%s\n' "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"

    - name: Audit bot order state (non-production ref)
      if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
      env:
        KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
        KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
        TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Bangkok' }}
      run: python -u kraken_order_audit.py

    - name: Check Portfolio Balance
      if: github.ref == 'refs/heads/main'
      env:
        # API credentials
        KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
        KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
        
        # Discord notification
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        
        # Configuration
        TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Bangkok' }}
        
        # Manual short reports are opt-in; monthly reports include trade history.
        SHORT_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.short_report == true && 'true' || 'false' }}
        
      run: python -u portfolio_balance.py
