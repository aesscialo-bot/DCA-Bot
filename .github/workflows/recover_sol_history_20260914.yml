name: Recover September 14 SOL History

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview first; apply only the exact reviewed manifest hash
        required: true
        default: preview
        type: choice
        options: [preview, apply]
      expected_manifest_hash:
        description: Full manifest SHA256 from preview; required for apply
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dca-kraken-history-writer
  queue: max
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Load private history Gist identity
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_VARS }}
        shell: bash
        run: |
          set -euo pipefail
          value="$(gh variable get DCA_HISTORY_GIST_ID --repo "$GITHUB_REPOSITORY")"
          printf '::add-mask::%s\n' "$value"
          printf 'DCA_HISTORY_GIST_ID=%s\n' "$value" >> "$GITHUB_ENV"
      - name: Validate or recover the reviewed historical SOL entry
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GH_PAT_FOR_VARS: ${{ secrets.GH_PAT_FOR_VARS }}
          RECOVERY_MODE: ${{ inputs.mode }}
          RECOVERY_EXPECTED_HASH: ${{ inputs.expected_manifest_hash }}
        run: python -u recover_sol_history_20260914.py --mode "$RECOVERY_MODE" --expected-manifest-hash "$RECOVERY_EXPECTED_HASH"
