name: Update DCA Configuration

on:
  workflow_dispatch:
    inputs:
      action:
        description: Atomic configuration operation
        required: true
        type: choice
        options:
          - set_amounts
          - set_enabled
          - dry_run
      symbol:
        description: Canonical Kraken key (BTC_GBP, ETH_GBP, SOL_GBP, or DOGE_GBP), or lowercase all for atomic set_enabled only
        required: true
        type: string
      low_amount_gbp_json:
        description: JSON number for the lower endpoint used in UPTREND
        required: false
        default: ""
        type: string
      mid_amount_gbp_json:
        description: JSON number used in SIDEWAYS (blank derives the legacy midpoint)
        required: false
        default: ""
        type: string
      up_amount_gbp_json:
        description: Compatibility name for the upper endpoint used in DOWNTREND
        required: false
        default: ""
        type: string
      enabled_json:
        description: JSON boolean for set_enabled
        required: false
        default: ""
        type: string
      expected_rules_hash:
        description: Reviewed target rules fingerprint; for all use the global rules fingerprint
        required: false
        default: ""
        type: string
      expected_decision_id:
        description: Legacy compatibility input (not required for guarded enabling)
        required: false
        default: ""
        type: string
      expected_global_rules_hash:
        description: Canonical fingerprint of all four reviewed rules
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  # Acquire analysis first only for enabling. An enable queued behind a long
  # analysis must not hold the rules lock and delay a later emergency disable.
  group: ${{ inputs.action == 'set_enabled' && inputs.enabled_json == 'true' && 'dca-analysis-state-writers' || format('dca-config-no-analysis-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

jobs:
  update:
    name: Validate and update rules
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      # Every config write shares this lock, independent of the trader. Enable
      # jobs arrive here only after acquiring the outer analysis lock.
      group: dca-rule-writers
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate atomic update against live state
        id: config_update
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_VARS }}
          DCA_WORKFLOW_READ_TOKEN: ${{ github.token }}
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          ACTION: ${{ inputs.action }}
          SYMBOL: ${{ inputs.symbol }}
          LOW_AMOUNT_GBP_JSON: ${{ inputs.low_amount_gbp_json }}
          MID_AMOUNT_GBP_JSON: ${{ inputs.mid_amount_gbp_json }}
          UP_AMOUNT_GBP_JSON: ${{ inputs.up_amount_gbp_json }}
          ENABLED_JSON: ${{ inputs.enabled_json }}
          EXPECTED_RULES_HASH: ${{ inputs.expected_rules_hash }}
          EXPECTED_DECISION_ID: ${{ inputs.expected_decision_id }}
          EXPECTED_GLOBAL_RULES_HASH: ${{ inputs.expected_global_rules_hash }}
        shell: bash
        run: |
          set -euo pipefail
          # A fresh dispatch has a new ordering identity. Replaying an old
          # enable OR disable could otherwise invert the operator's requests.
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "::error::Configuration runs cannot be replayed; check status and send a fresh command."
            exit 1
          fi
          check_target_migration_lock() {
            local lock_error="$RUNNER_TEMP/target-migration-lock-error.txt"
            if gh variable get DCA_TARGET_MIGRATION_LOCK --repo "$GITHUB_REPOSITORY" >/dev/null 2>"$lock_error"; then
              echo "A target migration is locked; refusing the update." >&2
              exit 1
            elif ! grep -Fq 'HTTP 404' "$lock_error" && \
                ! grep -Fq 'variable DCA_TARGET_MIGRATION_LOCK was not found' "$lock_error"; then
              echo "Could not check the target migration lock; refusing the update." >&2
              exit 1
            fi
          }
          check_target_migration_lock
          if ! DCA_TARGET_MAP=$(gh variable get DCA_TARGET_MAP --repo "$GITHUB_REPOSITORY" 2>/dev/null); then
            echo "Could not read DCA_TARGET_MAP; refusing the update." >&2
            exit 1
          fi
          if [ "$ACTION" = "set_enabled" ] && [ "$SYMBOL" = "all" ] && [ "$ENABLED_JSON" = "false" ]; then
            # Emergency bulk disable changes only flags, even when ancillary
            # state is missing, malformed, or temporarily unreadable.
            DCA_ANALYSIS_STATE='{}'
            DCA_EXECUTION_STATE='{}'
          else
            analysis_error="$RUNNER_TEMP/analysis-state-error.txt"
            if ! DCA_ANALYSIS_STATE=$(gh variable get DCA_ANALYSIS_STATE --repo "$GITHUB_REPOSITORY" 2>"$analysis_error"); then
              if grep -Fq 'variable DCA_ANALYSIS_STATE was not found' "$analysis_error"; then
                DCA_ANALYSIS_STATE='{}'
              else
                echo "Could not check DCA_ANALYSIS_STATE; refusing the update." >&2
                exit 1
              fi
            fi
            execution_error="$RUNNER_TEMP/execution-state-error.txt"
            if ! DCA_EXECUTION_STATE=$(gh variable get DCA_EXECUTION_STATE --repo "$GITHUB_REPOSITORY" 2>"$execution_error"); then
              if ! grep -Fq 'variable DCA_EXECUTION_STATE was not found' "$execution_error"; then
                echo "Could not check DCA_EXECUTION_STATE; refusing the update." >&2
                exit 1
              elif [ "$ACTION" = "set_enabled" ] && [ "$ENABLED_JSON" = "true" ]; then
                echo "Could not read DCA_EXECUTION_STATE; refusing enable." >&2
                exit 1
              fi
              DCA_EXECUTION_STATE='{}'
            fi
          fi
          for value in "$DCA_TARGET_MAP" "$DCA_ANALYSIS_STATE" "$DCA_EXECUTION_STATE"; do
            while IFS= read -r line; do
              [ -z "$line" ] || printf '::add-mask::%s\n' "$line"
            done <<< "$value"
          done
          export DCA_TARGET_MAP DCA_ANALYSIS_STATE DCA_EXECUTION_STATE

          OUTPUT_FILE="$RUNNER_TEMP/dca-target-map.json"
          ANALYSIS_OUTPUT_FILE="$RUNNER_TEMP/dca-enable-analysis.json"
          # Untrusted inputs, exchange responses, and production JSON must not
          # escape in a traceback. Only fixed diagnostics are logged here.
          if ! python -u dca_config_writer.py \
            --action "$ACTION" \
            --symbol "$SYMBOL" \
            --low-amount-gbp-json "$LOW_AMOUNT_GBP_JSON" \
            --mid-amount-gbp-json "$MID_AMOUNT_GBP_JSON" \
            --up-amount-gbp-json "$UP_AMOUNT_GBP_JSON" \
            --enabled-json "$ENABLED_JSON" \
            --expected-rules-hash "$EXPECTED_RULES_HASH" \
            --expected-decision-id "$EXPECTED_DECISION_ID" \
            --expected-global-rules-hash "$EXPECTED_GLOBAL_RULES_HASH" \
            --output "$OUTPUT_FILE" --analysis-output "$ANALYSIS_OUTPUT_FILE" \
            >"$RUNNER_TEMP/config-validation.log" 2>&1; then
            echo "::error::Configuration validation failed; check budgets, confirmation, pending orders, and Kraken availability. Run analyze all if analysis state is invalid."
            exit 1
          fi

          if [ "$ACTION" = "dry_run" ]; then
            echo "verified_result=validated" >> "$GITHUB_OUTPUT"
            echo "Dry run passed; DCA_TARGET_MAP was not changed."
            exit 0
          fi
          check_target_migration_lock
          if [ "$ACTION" = "set_enabled" ] && [ "$ENABLED_JSON" = "true" ]; then
            # A newer stop can leave the same flags/hash (already disabled).
            # Check durable request ordering, not only the reviewed rule hash.
            python -u dca_config_queue_guard.py
            # Prior decisions for every selected target (all four for symbol=all)
            # must not revive after disable/re-enable.
            # This job holds the rules lock as well as the outer analysis lock.
            if ! gh variable set DCA_ANALYSIS_STATE --repo "$GITHUB_REPOSITORY" \
              --body "$(<"$ANALYSIS_OUTPUT_FILE")" >"$RUNNER_TEMP/enable-analysis-write.log" 2>&1; then
              echo "::error::Analysis invalidation was not confirmed; enable was not written."
              exit 1
            fi
            ANALYSIS_READBACK_FILE="$RUNNER_TEMP/dca-enable-analysis-readback.json"
            if ! gh variable get DCA_ANALYSIS_STATE --repo "$GITHUB_REPOSITORY" \
              >"$ANALYSIS_READBACK_FILE" 2>"$RUNNER_TEMP/enable-analysis-readback-error.txt"; then
              echo "::error::Analysis invalidation readback failed; enable was not written."
              exit 1
            fi
            python -u dca_config_notification.py verify-analysis-readback \
              --expected "$ANALYSIS_OUTPUT_FILE" --observed "$ANALYSIS_READBACK_FILE"
            check_target_migration_lock
            # Recheck immediately before the one rules write, under its lock.
            python -u dca_config_queue_guard.py
          fi
          if ! gh variable set DCA_TARGET_MAP \
            --repo "$GITHUB_REPOSITORY" \
            --body "$(<"$OUTPUT_FILE")" >"$RUNNER_TEMP/config-write.log" 2>&1; then
            echo "::error::Configuration write was not confirmed; inspect live status before retrying."
            exit 1
          fi
          READBACK_FILE="$RUNNER_TEMP/dca-target-map-readback.json"
          if ! gh variable get DCA_TARGET_MAP --repo "$GITHUB_REPOSITORY" \
            >"$READBACK_FILE" 2>"$RUNNER_TEMP/config-readback-error.txt"; then
            echo "::error::Configuration readback failed; a write may already have occurred."
            exit 1
          fi
          python -u dca_config_notification.py verify-readback \
            --expected "$OUTPUT_FILE" --observed "$READBACK_FILE"
          echo "verified_result=applied" >> "$GITHUB_OUTPUT"
          echo "Applied one serialized configuration update; persisted rules readback matched."

      - name: Publish configuration result to Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACTION: ${{ inputs.action }}
          SYMBOL: ${{ inputs.symbol }}
          CONFIG_STEP_OUTCOME: ${{ steps.config_update.outcome }}
          CONFIG_VERIFIED_RESULT: ${{ steps.config_update.outputs.verified_result }}
          CONFIG_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # A failed receipt makes this run visibly fail but never replays the write.
        run: python -u dca_config_notification.py notify
