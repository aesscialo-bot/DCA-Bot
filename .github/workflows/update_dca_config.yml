name: Update DCA Configuration

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Canonical Kraken GBP key
        required: true
        type: string
      field:
        description: One supported rule field
        required: true
        type: string
      value_json:
        description: JSON-encoded replacement value
        required: true
        type: string
      expected_amount_gbp_json:
        description: Confirmed amount snapshot required when enabling
        required: false
        default: ''
        type: string
      expected_time:
        description: Confirmed time snapshot required when enabling
        required: false
        default: ''
        type: string

concurrency:
  group: dca-target-map-writers
  queue: max
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Merge one validated field into the latest rules
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_VARS }}
          SYMBOL: ${{ inputs.symbol }}
          FIELD: ${{ inputs.field }}
          VALUE_JSON: ${{ inputs.value_json }}
          EXPECTED_AMOUNT_GBP_JSON: ${{ inputs.expected_amount_gbp_json }}
          EXPECTED_TIME: ${{ inputs.expected_time }}
        shell: bash
        run: |
          set -euo pipefail
          if ! CURRENT_MAP=$(gh variable get DCA_TARGET_MAP --repo "$GITHUB_REPOSITORY" 2>/dev/null); then
            echo "Could not fetch the live DCA_TARGET_MAP; refusing to update it." >&2
            exit 1
          fi
          if [ -z "$CURRENT_MAP" ]; then
            echo "Live DCA_TARGET_MAP is empty; refusing to update it." >&2
            exit 1
          fi
          export CURRENT_MAP

          UPDATED_MAP=$(python3 - <<'PY'
          import json
          import math
          import os
          import re

          key_pattern = re.compile(r"^[A-Z0-9]+_GBP$")
          time_pattern = re.compile(r"^(?:[01][0-9]|2[0-3]):[0-5][0-9]$")
          rules = json.loads(os.environ["CURRENT_MAP"])
          symbol = os.environ["SYMBOL"]
          field = os.environ["FIELD"]
          value = json.loads(os.environ["VALUE_JSON"])
          expected_amount_json = os.environ.get("EXPECTED_AMOUNT_GBP_JSON", "")
          expected_time = os.environ.get("EXPECTED_TIME", "")

          if not isinstance(rules, dict) or not rules:
              raise ValueError("DCA_TARGET_MAP must be a non-empty object")

          def is_finite_number(value):
              return (
                  not isinstance(value, bool)
                  and isinstance(value, (int, float))
                  and math.isfinite(value)
              )

          def validate_dynamic_dca(key, dynamic_dca):
              if dynamic_dca is None:
                  return
              if not isinstance(dynamic_dca, dict):
                  raise ValueError(f"{key}.DYNAMIC_DCA must be an object")
              if "ENABLED" in dynamic_dca and not isinstance(dynamic_dca["ENABLED"], bool):
                  raise ValueError(f"{key}.DYNAMIC_DCA.ENABLED must be boolean")
              if "THRESHOLD_PERCENT" in dynamic_dca and not is_finite_number(
                  dynamic_dca["THRESHOLD_PERCENT"]
              ):
                  raise ValueError(f"{key}.DYNAMIC_DCA.THRESHOLD_PERCENT must be numeric")
              if "REDUCED_MULTIPLIER" in dynamic_dca:
                  multiplier = dynamic_dca["REDUCED_MULTIPLIER"]
                  if not is_finite_number(multiplier) or not 0 < multiplier <= 1:
                      raise ValueError(
                          f"{key}.DYNAMIC_DCA.REDUCED_MULTIPLIER must be above 0 and at most 1"
                      )

          def validate_entry(key, entry):
              if not key_pattern.fullmatch(key) or not isinstance(entry, dict):
                  raise ValueError(f"Invalid GBP rule entry: {key!r}")
              if "AMOUNT" in entry:
                  raise ValueError(f"Unsupported amount field in {key}")
              execution_fields = {"LAST_BUY_DATE", "PENDING_ORDER"}.intersection(entry)
              if execution_fields:
                  fields = ", ".join(sorted(execution_fields))
                  raise ValueError(f"Execution-only field(s) in {key}: {fields}")
              if not isinstance(entry.get("TIME"), str) or not time_pattern.fullmatch(entry["TIME"]):
                  raise ValueError(f"Invalid TIME in {key}")
              enabled = entry.get("BUY_ENABLED")
              amount = entry.get("AMOUNT_GBP")
              if not isinstance(enabled, bool):
                  raise ValueError(f"Invalid BUY_ENABLED in {key}")
              if not is_finite_number(amount):
                  raise ValueError(f"Invalid AMOUNT_GBP in {key}")
              minimum = 5 if enabled else 0
              if not minimum <= amount <= 1000:
                  raise ValueError(f"AMOUNT_GBP outside guardrails in {key}")
              validate_dynamic_dca(key, entry.get("DYNAMIC_DCA"))

          for key, entry in rules.items():
              validate_entry(key, entry)

          if symbol not in rules or not key_pattern.fullmatch(symbol):
              raise ValueError(f"Unknown GBP target: {symbol}")
          if field not in {"TIME", "AMOUNT_GBP", "BUY_ENABLED"}:
              raise ValueError(f"Unsupported field: {field}")
          if field == "TIME" and (not isinstance(value, str) or not time_pattern.fullmatch(value)):
              raise ValueError("TIME must use 24-hour HH:MM")
          if field == "AMOUNT_GBP":
              if not is_finite_number(value):
                  raise ValueError("AMOUNT_GBP must be numeric")
              if not 0 <= value <= 1000:
                  raise ValueError("AMOUNT_GBP must be between 0 and 1000")
          if field == "BUY_ENABLED" and not isinstance(value, bool):
              raise ValueError("BUY_ENABLED must be boolean")

          if field == "BUY_ENABLED" and value is True:
              if not expected_amount_json or not expected_time:
                  raise ValueError(
                      "Enabling requires the confirmed amount and time snapshot"
                  )
              expected_amount = json.loads(expected_amount_json)
              if not is_finite_number(expected_amount):
                  raise ValueError("Confirmed AMOUNT_GBP snapshot must be numeric")
              if rules[symbol]["AMOUNT_GBP"] != expected_amount:
                  raise ValueError(
                      "AMOUNT_GBP changed after enable confirmation; refusing to enable"
                  )
              if rules[symbol]["TIME"] != expected_time:
                  raise ValueError(
                      "TIME changed after enable confirmation; refusing to enable"
                  )

          candidate = dict(rules[symbol])
          candidate[field] = value
          validate_entry(symbol, candidate)
          rules[symbol] = candidate
          print(json.dumps(rules, separators=(",", ":")))
          PY
          )

          gh variable set DCA_TARGET_MAP \
            --repo "$GITHUB_REPOSITORY" \
            --body "$UPDATED_MAP"
          echo "Updated $SYMBOL.$FIELD through the serialized writer queue."
