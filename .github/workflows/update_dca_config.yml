name: Update DCA Configuration

on:
  workflow_dispatch:
    inputs:
      action:
        description: Atomic configuration operation
        required: true
        type: choice
        options:
          - set_amounts
          - set_enabled
          - dry_run
      symbol:
        description: Canonical Kraken key (BTC_GBP, ETH_GBP, or SOL_GBP)
        required: true
        type: string
      low_amount_gbp_json:
        description: JSON number for the lower endpoint used in UPTREND
        required: false
        default: ""
        type: string
      up_amount_gbp_json:
        description: Compatibility name for the upper endpoint used in DOWNTREND
        required: false
        default: ""
        type: string
      enabled_json:
        description: JSON boolean for set_enabled
        required: false
        default: ""
        type: string
      expected_rules_hash:
        description: Exact rules fingerprint reviewed before enabling
        required: false
        default: ""
        type: string
      expected_decision_id:
        description: Exact analysis decision reviewed before enabling
        required: false
        default: ""
        type: string
      expected_global_rules_hash:
        description: Canonical fingerprint of all three reviewed rules
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Rule writes serialize with each other but remain independent of the trader,
  # allowing a disable to reach the trader's final live-state check immediately.
  group: dca-rule-writers
  queue: max
  cancel-in-progress: false

jobs:
  update:
    name: Validate and update rules
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate atomic update against live state
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_VARS }}
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          ACTION: ${{ inputs.action }}
          SYMBOL: ${{ inputs.symbol }}
          LOW_AMOUNT_GBP_JSON: ${{ inputs.low_amount_gbp_json }}
          UP_AMOUNT_GBP_JSON: ${{ inputs.up_amount_gbp_json }}
          ENABLED_JSON: ${{ inputs.enabled_json }}
          EXPECTED_RULES_HASH: ${{ inputs.expected_rules_hash }}
          EXPECTED_DECISION_ID: ${{ inputs.expected_decision_id }}
          EXPECTED_GLOBAL_RULES_HASH: ${{ inputs.expected_global_rules_hash }}
        shell: bash
        run: |
          set -euo pipefail
          check_target_migration_lock() {
            local lock_error="$RUNNER_TEMP/target-migration-lock-error.txt"
            if gh variable get DCA_TARGET_MIGRATION_LOCK --repo "$GITHUB_REPOSITORY" >/dev/null 2>"$lock_error"; then
              echo "A target migration is locked; refusing the update." >&2
              exit 1
            elif ! grep -Fq 'HTTP 404' "$lock_error" && \
                ! grep -Fq 'variable DCA_TARGET_MIGRATION_LOCK was not found' "$lock_error"; then
              echo "Could not check the target migration lock; refusing the update." >&2
              exit 1
            fi
          }
          check_target_migration_lock
          if ! DCA_TARGET_MAP=$(gh variable get DCA_TARGET_MAP --repo "$GITHUB_REPOSITORY" 2>/dev/null); then
            echo "Could not read DCA_TARGET_MAP; refusing the update." >&2
            exit 1
          fi
          analysis_error="$RUNNER_TEMP/analysis-state-error.txt"
          if ! DCA_ANALYSIS_STATE=$(gh variable get DCA_ANALYSIS_STATE --repo "$GITHUB_REPOSITORY" 2>"$analysis_error"); then
            if grep -Fq 'variable DCA_ANALYSIS_STATE was not found' "$analysis_error"; then
              DCA_ANALYSIS_STATE='{}'
            else
              echo "Could not check DCA_ANALYSIS_STATE; refusing the update." >&2
              exit 1
            fi
          fi
          execution_error="$RUNNER_TEMP/execution-state-error.txt"
          if ! DCA_EXECUTION_STATE=$(gh variable get DCA_EXECUTION_STATE --repo "$GITHUB_REPOSITORY" 2>"$execution_error"); then
            if ! grep -Fq 'variable DCA_EXECUTION_STATE was not found' "$execution_error"; then
              echo "Could not check DCA_EXECUTION_STATE; refusing the update." >&2
              exit 1
            elif [ "$ACTION" = "set_enabled" ] && [ "$ENABLED_JSON" = "true" ]; then
              echo "Could not read DCA_EXECUTION_STATE; refusing enable." >&2
              exit 1
            fi
            DCA_EXECUTION_STATE='{}'
          fi
          for value in "$DCA_TARGET_MAP" "$DCA_ANALYSIS_STATE" "$DCA_EXECUTION_STATE"; do
            while IFS= read -r line; do
              [ -z "$line" ] || printf '::add-mask::%s\n' "$line"
            done <<< "$value"
          done
          export DCA_TARGET_MAP DCA_ANALYSIS_STATE DCA_EXECUTION_STATE

          OUTPUT_FILE="$RUNNER_TEMP/dca-target-map.json"
          python -u dca_config_writer.py \
            --action "$ACTION" \
            --symbol "$SYMBOL" \
            --low-amount-gbp-json "$LOW_AMOUNT_GBP_JSON" \
            --up-amount-gbp-json "$UP_AMOUNT_GBP_JSON" \
            --enabled-json "$ENABLED_JSON" \
            --expected-rules-hash "$EXPECTED_RULES_HASH" \
            --expected-decision-id "$EXPECTED_DECISION_ID" \
            --expected-global-rules-hash "$EXPECTED_GLOBAL_RULES_HASH" \
            --output "$OUTPUT_FILE"

          if [ "$ACTION" = "dry_run" ]; then
            echo "Dry run passed; DCA_TARGET_MAP was not changed."
            exit 0
          fi
          check_target_migration_lock
          gh variable set DCA_TARGET_MAP \
            --repo "$GITHUB_REPOSITORY" \
            --body "$(<"$OUTPUT_FILE")"
          echo "Applied one serialized configuration update for $SYMBOL."
