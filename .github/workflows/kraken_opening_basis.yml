name: Kraken Opening Performance Basis

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Build immutable source evidence first, then the compact basis
        required: true
        default: source
        type: choice
        options:
          - source
          - basis
      mode:
        description: Preview a hash for review before selecting publish
        required: true
        default: preview
        type: choice
        options:
          - preview
          - publish
      generated_at:
        description: Fixed UTC timestamp reused unchanged by source and basis stages
        required: true
        type: string
      expected_canonical_hash:
        description: Required in publish mode; copy the exact reviewed preview hash
        required: false
        type: string
      source_commit_sha:
        description: Basis publish requires the exact source commit from basis preview
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dca-execution-state-writers
  cancel-in-progress: false

jobs:
  opening-basis:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Load protected execution state
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_VARS }}
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh variable get DCA_EXECUTION_STATE --repo "$GITHUB_REPOSITORY")"
          while IFS= read -r line; do
            [ -z "$line" ] || printf '::add-mask::%s\n' "$line"
          done <<< "$state"
          delimiter="DCA_BASIS_${GITHUB_RUN_ID}_${RANDOM}"
          printf 'DCA_EXECUTION_STATE<<%s\n%s\n%s\n' "$delimiter" "$state" "$delimiter" >> "$GITHUB_ENV"
      - name: Build or publish immutable evidence
        env:
          KRAKEN_API_KEY: ${{ inputs.stage == 'source' && secrets.KRAKEN_API_KEY || '' }}
          KRAKEN_API_SECRET: ${{ inputs.stage == 'source' && secrets.KRAKEN_API_SECRET || '' }}
          DCA_OUTBOX_REPOSITORY_OWNER: ${{ vars.DCA_OUTBOX_REPOSITORY_OWNER }}
          DCA_OUTBOX_REPOSITORY_NAME: ${{ vars.DCA_OUTBOX_REPOSITORY_NAME }}
          DCA_OUTBOX_REPOSITORY_BRANCH: ${{ vars.DCA_OUTBOX_REPOSITORY_BRANCH }}
          DCA_OUTBOX_AUDIT_PATH: ${{ vars.DCA_OUTBOX_AUDIT_PATH }}
          DCA_OUTBOX_EVENT_PATH: ${{ vars.DCA_OUTBOX_EVENT_PATH }}
          DCA_OUTBOX_HOLDINGS_PATH: ${{ vars.DCA_OUTBOX_HOLDINGS_PATH }}
          DCA_OUTBOX_OPENING_BASIS_SOURCE_PATH: ${{ vars.DCA_OUTBOX_OPENING_BASIS_SOURCE_PATH }}
          DCA_OUTBOX_OPENING_BASIS_PATH: ${{ vars.DCA_OUTBOX_OPENING_BASIS_PATH }}
          DCA_OUTBOX_REPOSITORY_TOKEN: ${{ secrets.DCA_OUTBOX_REPOSITORY_TOKEN }}
          DCA_OPENING_BASIS_FUNDING_LINKS_JSON: ${{ inputs.stage == 'basis' && vars.DCA_OPENING_BASIS_FUNDING_LINKS_JSON || '' }}
          BASIS_STAGE: ${{ inputs.stage }}
          BASIS_MODE: ${{ inputs.mode }}
          BASIS_GENERATED_AT: ${{ inputs.generated_at }}
          BASIS_EXPECTED_HASH: ${{ inputs.expected_canonical_hash }}
          BASIS_SOURCE_COMMIT: ${{ inputs.source_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--stage "$BASIS_STAGE" --mode "$BASIS_MODE" --generated-at "$BASIS_GENERATED_AT")
          if [ -n "$BASIS_EXPECTED_HASH" ]; then
            args+=(--expected-canonical-hash "$BASIS_EXPECTED_HASH")
          fi
          if [ -n "$BASIS_SOURCE_COMMIT" ]; then
            args+=(--source-commit-sha "$BASIS_SOURCE_COMMIT")
          fi
          python -u -m ghostfolio.kraken_opening_basis "${args[@]}"
