name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r bot_requirements.txt PyYAML==6.0.2

      - name: Compile Python
        run: python -m compileall -q .

      - name: Run unit tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v

      - name: Validate workflow YAML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path(".github/workflows").glob("*.yml")):
              with path.open(encoding="utf-8") as handle:
                  document = yaml.safe_load(handle)
              if not isinstance(document, dict) or not document.get("jobs"):
                  raise SystemExit(f"Invalid workflow structure: {path}")
              print(f"validated {path.name}")
          PY

      - name: Build Railway image
        run: docker build --tag dca-bot-ci:${{ github.sha }} .
