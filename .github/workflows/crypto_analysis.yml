name: Crypto Analysis

on:
  schedule:
    # Run at 21:00 UTC (04:00 BKK) every day
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Kraken GBP pairs (e.g., BTC/GBP, SUI/GBP). Leave empty to use DCA_TARGET_MAP.'
        required: false
        default: ''
      short_report:
        description: 'Send short report (AI summary only)'
        required: false
        type: boolean
        default: true

# Prevent race conditions: Only one analysis can run at a time
concurrency:
  group: dca-target-map-writers
  queue: max
  cancel-in-progress: false  # Serialize repository-variable writers

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      # Freeze the input map for this job so computed TIME deltas can be
      # distinguished from concurrent live configuration changes.
      DCA_TARGET_MAP_SNAPSHOT: ${{ vars.DCA_TARGET_MAP }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: pip install --upgrade pip && pip install -r requirements.txt

    - name: Run Analysis
      id: analysis
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Bangkok' }}
        DCA_TARGET_MAP: ${{ env.DCA_TARGET_MAP_SNAPSHOT }}
        # Analyze the same Kraken GBP markets that the bot trades.
        EXCHANGE_ID: "kraken"
        # If explicit input provided, use it. Otherwise leave empty so
        # crypto_analysis.py derives symbols from DCA_TARGET_MAP automatically.
        SYMBOL: ${{ inputs.symbol || '' }}
        # Report format: true = AI summary only, false = full detailed analysis (default: true)
        # Only check input value on manual dispatch; push/schedule always get short report
        SHORT_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.short_report == false && 'false' || 'true' }}
      run: python crypto_analysis.py

    - name: Update Repository Variable
      if: success() && steps.analysis.outputs.best_time_map != ''
      env:
        GH_TOKEN: ${{ secrets.GH_PAT_FOR_VARS }} # Needs a Personal Access Token with repo scope
        BEST_TIME_MAP: ${{ steps.analysis.outputs.best_time_map }}
      run: |
        set -euo pipefail

        echo "Fetching live DCA_TARGET_MAP to safely merge TIME updates..."
        if ! CURRENT_MAP=$(gh variable get DCA_TARGET_MAP --repo "$GITHUB_REPOSITORY" 2>/dev/null); then
          echo "Could not fetch the live DCA_TARGET_MAP; refusing to write stale analysis data." >&2
          exit 1
        fi
        if [ -z "$CURRENT_MAP" ]; then
          echo "Live DCA_TARGET_MAP is empty; refusing to overwrite it." >&2
          exit 1
        fi

        export CURRENT_MAP
        RESULT=$(python3 - <<'PY'
        import json
        import math
        import os
        import re
        import sys

        live = json.loads(os.environ["CURRENT_MAP"])
        original = json.loads(os.environ["DCA_TARGET_MAP_SNAPSHOT"])
        analyzed = json.loads(os.environ["BEST_TIME_MAP"])

        key_pattern = re.compile(r"^[A-Z0-9]+_GBP$")
        time_pattern = re.compile(r"^([01][0-9]|2[0-3]):[0-5][0-9]$")

        def is_finite_number(value):
            return (
                not isinstance(value, bool)
                and isinstance(value, (int, float))
                and math.isfinite(value)
            )

        def validate_dynamic_dca(label, key, dynamic_dca):
            if dynamic_dca is None:
                return
            if not isinstance(dynamic_dca, dict):
                raise ValueError(f"{label}.{key}.DYNAMIC_DCA must be an object")
            if "ENABLED" in dynamic_dca and not isinstance(dynamic_dca["ENABLED"], bool):
                raise ValueError(f"{label}.{key}.DYNAMIC_DCA.ENABLED must be boolean")
            if "THRESHOLD_PERCENT" in dynamic_dca and not is_finite_number(
                dynamic_dca["THRESHOLD_PERCENT"]
            ):
                raise ValueError(
                    f"{label}.{key}.DYNAMIC_DCA.THRESHOLD_PERCENT must be numeric"
                )
            if "REDUCED_MULTIPLIER" in dynamic_dca:
                multiplier = dynamic_dca["REDUCED_MULTIPLIER"]
                if not is_finite_number(multiplier) or not 0 < multiplier <= 1:
                    raise ValueError(
                        f"{label}.{key}.DYNAMIC_DCA.REDUCED_MULTIPLIER must be above 0 and at most 1"
                    )

        def validate_map(label, target_map):
            if not isinstance(target_map, dict) or not target_map:
                raise ValueError(f"{label} must be a non-empty JSON object")
            for key, config in target_map.items():
                if not isinstance(key, str) or not key_pattern.fullmatch(key):
                    raise ValueError(f"{label} contains a non-GBP target: {key!r}")
                if not isinstance(config, dict):
                    raise ValueError(f"{label}.{key} must be an object")
                if "AMOUNT" in config:
                    raise ValueError(f"{label}.{key} uses legacy AMOUNT instead of AMOUNT_GBP")
                execution_fields = {"LAST_BUY_DATE", "PENDING_ORDER"}.intersection(config)
                if execution_fields:
                    fields = ", ".join(sorted(execution_fields))
                    raise ValueError(
                        f"{label}.{key} contains execution-only field(s): {fields}"
                    )

                target_time = config.get("TIME")
                amount = config.get("AMOUNT_GBP")
                enabled = config.get("BUY_ENABLED")
                if not isinstance(target_time, str) or not time_pattern.fullmatch(target_time):
                    raise ValueError(f"{label}.{key}.TIME must use 24-hour HH:MM")
                if not isinstance(enabled, bool):
                    raise ValueError(f"{label}.{key}.BUY_ENABLED must be boolean")
                if not is_finite_number(amount):
                    raise ValueError(f"{label}.{key}.AMOUNT_GBP must be numeric")
                minimum = 5 if enabled else 0
                if not minimum <= amount <= 1000:
                    raise ValueError(
                        f"{label}.{key}.AMOUNT_GBP must be between {minimum} and 1000"
                    )
                validate_dynamic_dca(label, key, config.get("DYNAMIC_DCA"))

        validate_map("live DCA_TARGET_MAP", live)
        validate_map("analysis snapshot", original)
        validate_map("analysis output", analyzed)

        if set(analyzed) != set(original):
            raise ValueError("Analysis output changed the target set")
        for key in original:
            original_rules = {name: value for name, value in original[key].items() if name != "TIME"}
            analyzed_rules = {name: value for name, value in analyzed[key].items() if name != "TIME"}
            if analyzed_rules != original_rules:
                raise ValueError(f"Analysis output changed non-TIME rules for {key}")

        applied = []
        conflicts = []

        for key, original_config in original.items():
            analyzed_config = analyzed[key]
            live_config = live.get(key)

            old_time = original_config.get("TIME")
            new_time = analyzed_config.get("TIME")
            if new_time == old_time:
                continue

            # Preserve a user or trader change made while analysis was running.
            if live_config is None or live_config.get("TIME") != old_time:
                conflicts.append(key)
                continue

            live_config["TIME"] = new_time
            applied.append(key)

        if conflicts:
            print(
                "Skipped concurrent TIME changes for: " + ", ".join(conflicts),
                file=sys.stderr,
            )

        print(len(applied))
        print(json.dumps(live, separators=(",", ":")))
        PY
        )

        APPLIED_COUNT=${RESULT%%$'\n'*}
        MERGED=${RESULT#*$'\n'}
        if [ "$APPLIED_COUNT" -eq 0 ]; then
          echo "No new, conflict-free TIME recommendations to apply."
          exit 0
        fi

        echo "Applying $APPLIED_COUNT TIME update(s); all other live fields are preserved."
        gh variable set DCA_TARGET_MAP \
          --repo "$GITHUB_REPOSITORY" \
          --body "$MERGED"
