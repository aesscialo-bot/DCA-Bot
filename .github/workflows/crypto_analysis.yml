name: Crypto Analysis

on:
  schedule:
    # 04:00 Asia/Bangkok. The engine discards every incomplete Kraken candle.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      symbol:
        description: BTC, ETH, SOL, ADA, a canonical GBP pair, or all
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: dca-analysis-state-writers
  queue: max
  cancel-in-progress: false

jobs:
  analyze:
    name: Build deterministic decisions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Analyze Kraken GBP markets
        env:
          DCA_TARGET_MAP: ${{ vars.DCA_TARGET_MAP }}
          DCA_ANALYSIS_STATE: ${{ vars.DCA_ANALYSIS_STATE || '' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT_FOR_VARS: ${{ secrets.GH_PAT_FOR_VARS }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Bangkok' }}
          SYMBOL: ${{ inputs.symbol || 'all' }}
        run: python -u crypto_analysis.py
