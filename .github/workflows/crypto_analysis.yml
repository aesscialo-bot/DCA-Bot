name: Crypto Analysis

on:
  schedule:
    # 04:07 primary plus 04:37 idempotent recovery, Asia/Bangkok.
    - cron: "7,37 21 * * *"
  workflow_dispatch:
    inputs:
      symbol:
        description: BTC, ETH, SOL, a canonical configured pair, or all
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: dca-analysis-state-writers
  cancel-in-progress: false

jobs:
  analyze:
    name: Build deterministic decisions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Load protected production state
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_VARS }}
        shell: bash
        run: |
          set -euo pipefail
          lock_error="$RUNNER_TEMP/target-migration-lock-error.txt"
          if gh variable get DCA_TARGET_MIGRATION_LOCK --repo "$GITHUB_REPOSITORY" >/dev/null 2>"$lock_error"; then
            echo "A target migration is locked; refusing analysis state writes." >&2
            exit 1
          elif ! grep -q 'HTTP 404' "$lock_error"; then
            echo "Could not check the target migration lock; refusing analysis." >&2
            exit 1
          fi
          load_variable() {
            local name="$1"
            local value
            if ! value="$(gh variable get "$name" --repo "$GITHUB_REPOSITORY" 2>/dev/null)"; then
              echo "Could not load required repository variable $name." >&2
              exit 1
            fi
            while IFS= read -r line; do
              [ -z "$line" ] || printf '::add-mask::%s\n' "$line"
            done <<< "$value"
            local delimiter="DCA_${GITHUB_RUN_ID}_${RANDOM}"
            printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
          }
          load_variable DCA_TARGET_MAP
          if gh variable get DCA_ANALYSIS_STATE --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            load_variable DCA_ANALYSIS_STATE
          else
            printf 'DCA_ANALYSIS_STATE={}\n' >> "$GITHUB_ENV"
          fi

      - name: Validate dedicated history storage
        env:
          DCA_HISTORY_GIST_ID: ${{ vars.DCA_HISTORY_GIST_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DCA_HISTORY_GIST_ID" || {
            echo "DCA_HISTORY_GIST_ID is not configured." >&2
            exit 1
          }

      - name: Refresh first-party Kraken history
        env:
          DCA_HISTORY_GIST_ID: ${{ vars.DCA_HISTORY_GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python -u kraken_history.py refresh --targets all

      - name: Analyze configured Kraken markets
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT_FOR_VARS: ${{ secrets.GH_PAT_FOR_VARS }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Bangkok' }}
          DCA_START_DATE: ${{ vars.DCA_START_DATE }}
          DCA_TRADING_MODE: ${{ vars.DCA_TRADING_MODE || 'shadow' }}
          DCA_CANARY_SYMBOL: ${{ vars.DCA_CANARY_SYMBOL || 'SOL_GBP' }}
          DCA_HISTORY_GIST_ID: ${{ vars.DCA_HISTORY_GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          SYMBOL: ${{ inputs.symbol || 'all' }}
        run: python -u crypto_analysis.py
