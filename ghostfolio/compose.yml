name: dca-ghostfolio

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    image: docker.io/ghostfolio/ghostfolio:3.43.0@sha256:7add3b49bed1d64e1ab19b2c2c202904de8b48065c91e1d0fceba3754666e0b9
    platform: linux/amd64
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: ${LOCALAPPDATA}/dca-ghostfolio/app.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      POSTGRES_DB: ghostfolio-db
      POSTGRES_USER: ghostfolio
      TZ: Asia/Bangkok
    ports:
      - 127.0.0.1:3333:3333
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:3333/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *bounded-logs

  postgres:
    image: docker.io/library/postgres:15-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    env_file: ${LOCALAPPDATA}/dca-ghostfolio/postgres.env
    environment:
      POSTGRES_DB: ghostfolio-db
      POSTGRES_USER: ghostfolio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -d ghostfolio-db -U ghostfolio']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *bounded-logs

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    user: "999:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: ${LOCALAPPDATA}/dca-ghostfolio/redis.env
    command: [sh, -c, 'exec redis-server --requirepass "$${REDIS_PASSWORD:?missing}"']
    healthcheck:
      test: [CMD-SHELL, 'redis-cli --pass "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *bounded-logs

  sync:
    build:
      context: .
      dockerfile: sync.Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    env_file: ${LOCALAPPDATA}/dca-ghostfolio/sync.env
    environment:
      GHOSTFOLIO_URL: http://app:3333
      SYNC_INTERVAL_SECONDS: "300"
    volumes:
      - sync-receipts:/receipts
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, /opt/sync/ghostfolio_sync.py, health]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *bounded-logs

volumes:
  postgres-data:
  sync-receipts:
